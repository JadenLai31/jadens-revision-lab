</style></head><body><div class="shell"><header class="top"><div class="logo">Jaden's <span>Revision Lab</span></div><span class="pill">Personal study dashboard</span></header><main id="app"></main><footer class="footer">Works offline · Progress stored in this browser only · Questions generated from your science revision topics</footer></div><script id="dataset" type="application/json">{"cards": [{"front": "Energy", "back": "Capacity to do work or cause change.", "topic": "energy"}, {"front": "Joule (J)", "back": "SI unit of energy.", "topic": "energy"}, {"front": "Work", "back": "Energy transferred when a force moves an object through a distance.", "topic": "energy"}, {"front": "Kinetic energy", "back": "Energy an object has because it is moving.", "topic": "energy"}, {"front": "Potential energy", "back": "Energy stored due to position or condition.", "topic": "energy"}, {"front": "Gravitational potential energy", "back": "Stored energy due to height in a gravitational field.", "topic": "energy"}, {"front": "Elastic potential energy", "back": "Energy stored when an object is stretched or compressed.", "topic": "energy"}, {"front": "Chemical energy", "back": "Energy stored in chemical substances such as food and batteries.", "topic": "energy"}, {"front": "Nuclear energy", "back": "Energy associated with an atom’s nucleus.", "topic": "energy"}, {"front": "Thermal energy", "back": "Energy associated with the motion and interactions of particles.", "topic": "energy"}, {"front": "Sound energy", "back": "Energy transferred by vibrations travelling through a medium.", "topic": "energy"}, {"front": "Light energy", "back": "Energy transferred by electromagnetic waves.", "topic": "energy"}, {"front": "Electrical energy", "back": "Energy transferred by electric charges.", "topic": "energy"}, {"front": "Energy transformation", "back": "A change from one form of energy to another.", "topic": "energy"}, {"front": "Energy transfer", "back": "Energy moving from one object or system to another.", "topic": "energy"}, {"front": "Conservation of energy", "back": "Energy cannot be created or destroyed.", "topic": "energy"}, {"front": "Useful energy", "back": "Energy transferred in the intended form.", "topic": "energy"}, {"front": "Wasted energy", "back": "Energy transferred in an unintended or less useful form.", "topic": "energy"}, {"front": "Efficiency", "back": "Useful output energy divided by input energy, multiplied by 100%.", "topic": "energy"}, {"front": "Mass", "back": "Amount of matter in an object; measured in kilograms.", "topic": "energy"}, {"front": "Speed", "back": "Distance travelled per unit time; measured in m/s.", "topic": "energy"}, {"front": "Gravity", "back": "Force attracting masses towards one another.", "topic": "energy"}, {"front": "Circuit", "back": "A complete conducting path for electric charge.", "topic": "electricity"}, {"front": "Closed circuit", "back": "A complete path allowing current to flow.", "topic": "electricity"}, {"front": "Open circuit", "back": "An incomplete path that prevents continuous current.", "topic": "electricity"}, {"front": "Electron", "back": "Negatively charged particle found around an atom’s nucleus.", "topic": "electricity"}, {"front": "Electric charge", "back": "Property of matter that causes electrical forces; measured in coulombs.", "topic": "electricity"}, {"front": "Electric field", "back": "Region where an electric charge experiences an electric force.", "topic": "electricity"}, {"front": "Current", "back": "Rate of flow of electric charge; measured in amperes.", "topic": "electricity"}, {"front": "Ampere (A)", "back": "Unit of electric current; one coulomb per second.", "topic": "electricity"}, {"front": "Voltage", "back": "Energy transferred per unit charge; measured in volts.", "topic": "electricity"}, {"front": "Volt (V)", "back": "Unit of potential difference; one joule per coulomb.", "topic": "electricity"}, {"front": "Resistance", "back": "Opposition to electric current; measured in ohms.", "topic": "electricity"}, {"front": "Ohm (Ω)", "back": "Unit of electrical resistance.", "topic": "electricity"}, {"front": "Ohm’s law", "back": "For an ohmic conductor at constant conditions, V = IR.", "topic": "electricity"}, {"front": "Conductor", "back": "Material that allows electric charge to flow easily, such as copper.", "topic": "electricity"}, {"front": "Insulator", "back": "Material that resists electric charge flow, such as plastic.", "topic": "electricity"}, {"front": "Load", "back": "Circuit component that converts electrical energy into another form.", "topic": "electricity"}, {"front": "Short circuit", "back": "Unintended low-resistance path that can cause excessive current.", "topic": "electricity"}, {"front": "Ammeter", "back": "Instrument that measures current; connected in series.", "topic": "electricity"}, {"front": "Voltmeter", "back": "Instrument that measures potential difference; connected in parallel.", "topic": "electricity"}, {"front": "Series circuit", "back": "Circuit with one path for current.", "topic": "electricity"}, {"front": "Parallel circuit", "back": "Circuit with two or more branches.", "topic": "electricity"}, {"front": "Direct current (DC)", "back": "Current that flows in one direction.", "topic": "electricity"}, {"front": "Alternating current (AC)", "back": "Current that periodically reverses direction.", "topic": "electricity"}, {"front": "Frequency", "back": "Number of complete cycles per second; measured in hertz.", "topic": "electricity"}, {"front": "Conventional current", "back": "Defined direction of positive charge flow, opposite electron flow in metals.", "topic": "electricity"}, {"front": "Battery", "back": "Source that supplies electrical energy from stored chemical energy.", "topic": "electricity"}, {"front": "Switch", "back": "Component used to open or close a circuit.", "topic": "electricity"}, {"front": "Resistor", "back": "Component that provides electrical resistance.", "topic": "electricity"}, {"front": "Rebound efficiency", "back": "Rebound height divided by drop height, multiplied by 100%.", "topic": "energy"}], "questions": [{"type": "mc", "q": "Which unit is used to measure energy?", "options": ["Volt", "Joule", "Ampere", "Ohm"], "answer": 1, "explanation": "Energy is measured in joules (J).", "topic": "energy"}, {"type": "mc", "q": "Which is an example of gravitational potential energy?", "options": ["A rolling skateboard", "A ringing bell", "A book on a high shelf", "A glowing lamp"], "answer": 2, "explanation": "An elevated object stores gravitational potential energy.", "topic": "energy"}, {"type": "mc", "q": "A 2 kg object moves at 3 m/s. What is its kinetic energy?", "options": ["3 J", "6 J", "9 J", "18 J"], "answer": 2, "explanation": "KE = ½ × 2 × 3² = 9 J.", "topic": "energy"}, {"type": "mc", "q": "What happens to kinetic energy if speed doubles and mass stays constant?", "options": ["It doubles", "It halves", "It quadruples", "It stays the same"], "answer": 2, "explanation": "Kinetic energy depends on speed squared.", "topic": "energy"}, {"type": "mc", "q": "Which statement describes conservation of energy?", "options": ["Energy disappears as heat", "Energy can be created by batteries", "Energy is always useful", "Energy is transferred or transformed, not destroyed"], "answer": 3, "explanation": "Total energy is conserved.", "topic": "energy"}, {"type": "mc", "q": "Which is the main useful energy output of a lamp?", "options": ["Light", "Thermal", "Sound", "Elastic"], "answer": 0, "explanation": "A lamp is designed to produce light.", "topic": "electricity"}, {"type": "mc", "q": "A device takes 200 J and provides 150 J useful output. Its efficiency is:", "options": ["25%", "50%", "75%", "150%"], "answer": 2, "explanation": "(150 ÷ 200) × 100 = 75%.", "topic": "energy"}, {"type": "mc", "q": "A ball is dropped from 150 cm and rebounds 94 cm. Approximate rebound efficiency is:", "options": ["16%", "58%", "63%", "94%"], "answer": 2, "explanation": "94 ÷ 150 × 100 ≈ 62.7%.", "topic": "energy"}, {"type": "mc", "q": "Which energy is stored in a stretched elastic band?", "options": ["Sound", "Elastic potential", "Light", "Nuclear"], "answer": 1, "explanation": "Deformation can store elastic potential energy.", "topic": "energy"}, {"type": "mc", "q": "What is required for continuous current in a simple circuit?", "options": ["An open switch", "A complete conducting path", "Two batteries", "No resistance"], "answer": 1, "explanation": "A closed circuit provides a continuous path.", "topic": "electricity"}, {"type": "mc", "q": "What is electric current?", "options": ["Energy per charge", "Resistance to flow", "Charge flowing per second", "Stored chemical energy"], "answer": 2, "explanation": "Current is the rate of charge flow.", "topic": "electricity"}, {"type": "mc", "q": "What does a voltmeter measure?", "options": ["Current", "Potential difference", "Resistance only", "Frequency"], "answer": 1, "explanation": "Voltage is potential difference between two points.", "topic": "electricity"}, {"type": "mc", "q": "How should an ammeter be connected?", "options": ["In parallel with a lamp", "Across the battery", "In series with the component", "Outside the circuit"], "answer": 2, "explanation": "An ammeter measures the current through a path.", "topic": "electricity"}, {"type": "mc", "q": "Which is the unit of resistance?", "options": ["Ohm", "Joule", "Volt", "Ampere"], "answer": 0, "explanation": "Resistance is measured in ohms (Ω).", "topic": "electricity"}, {"type": "mc", "q": "A resistor has 4 Ω resistance across 12 V. What current flows?", "options": ["0.33 A", "3 A", "8 A", "48 A"], "answer": 1, "explanation": "I = V/R = 12/4 = 3 A.", "topic": "electricity"}, {"type": "mc", "q": "In a series circuit, the current is:", "options": ["Different through each component", "Zero everywhere", "The same throughout", "Always 1 A"], "answer": 2, "explanation": "A series circuit has one current path.", "topic": "electricity"}, {"type": "mc", "q": "In a parallel circuit, each branch has:", "options": ["The same supply voltage", "The same resistance", "No current", "Half the supply voltage"], "answer": 0, "explanation": "Each parallel branch is connected across the supply.", "topic": "electricity"}, {"type": "mc", "q": "What happens if one lamp in a simple series circuit breaks?", "options": ["Other lamps get brighter", "The loop opens and all lamps go out", "Voltage doubles", "The battery becomes AC"], "answer": 1, "explanation": "A break interrupts the only current path.", "topic": "electricity"}, {"type": "mc", "q": "Which material is usually a good electrical insulator?", "options": ["Copper", "Aluminium", "Plastic", "Silver"], "answer": 2, "explanation": "Plastic strongly resists charge flow.", "topic": "electricity"}, {"type": "mc", "q": "Australian mains AC has a frequency of:", "options": ["5 Hz", "25 Hz", "50 Hz", "100 Hz"], "answer": 2, "explanation": "Australian mains electricity operates at 50 Hz.", "topic": "electricity"}, {"type": "short", "q": "Define kinetic energy and give one example.", "model": "Kinetic energy is energy due to motion, such as a moving bicycle.", "topic": "energy"}, {"type": "short", "q": "Explain the difference between an energy transfer and an energy transformation.", "model": "Transfer: energy moves between objects or systems. Transformation: energy changes form.", "topic": "energy"}, {"type": "short", "q": "State the law of conservation of energy.", "model": "Energy cannot be created or destroyed, only transferred or transformed.", "topic": "energy"}, {"type": "short", "q": "Calculate gravitational potential energy for a 3 kg object 2 m above the ground. Use g = 9.8 N/kg.", "model": "GPE = mgh = 3 × 9.8 × 2 = 58.8 J.", "topic": "energy"}, {"type": "short", "q": "A device receives 500 J and wastes 100 J. Calculate its efficiency.", "model": "Useful output = 400 J; efficiency = 400/500 × 100 = 80%.", "topic": "energy"}, {"type": "short", "q": "What is the difference between a conductor and an insulator? Give an example of each.", "model": "Conductors allow charge to flow easily (copper); insulators resist charge flow (plastic).", "topic": "electricity"}, {"type": "short", "q": "Explain the difference between voltage and current.", "model": "Voltage is energy transferred per unit charge; current is the rate of charge flow.", "topic": "electricity"}, {"type": "short", "q": "Explain how an ammeter and voltmeter are connected in a circuit.", "model": "An ammeter connects in series; a voltmeter connects in parallel across the component.", "topic": "electricity"}, {"type": "short", "q": "Describe one advantage and one disadvantage of a series circuit.", "model": "Advantage: simple with fewer wires. Disadvantage: a break stops the whole circuit.", "topic": "electricity"}, {"type": "short", "q": "Compare direct current (DC) with alternating current (AC).", "model": "DC flows in one direction; AC periodically reverses direction.", "topic": "electricity"}, {"type": "long", "q": "A ball is dropped, hits the ground and bounces lower. Explain its energy transformations and why it does not return to its starting height.", "model": "At the top the ball has gravitational potential energy. Falling transforms it to kinetic energy. On impact, some is stored temporarily as elastic energy. During rebound some returns to kinetic then gravitational potential energy. Some energy transfers to sound and thermal energy, so the rebound is lower. Energy is conserved overall.", "topic": "energy"}, {"type": "long", "q": "Compare series and parallel circuits, including current, voltage, advantages and disadvantages.", "model": "Series: one path; current is the same throughout; supply voltage is shared; simpler, but one break stops everything. Parallel: multiple paths; branch voltage equals supply voltage; current splits; branches work independently, but more wiring is required.", "topic": "electricity"}, {"type": "long", "q": "A lamp operates at 6 V and has a resistance of 3 Ω. Calculate current, explain the meaning of resistance, and describe how to measure current and voltage.", "model": "I = V/R = 6/3 = 2 A. Resistance opposes charge flow. Connect an ammeter in series to measure current, and a voltmeter in parallel across the lamp to measure voltage.", "topic": "electricity"}, {"type": "long", "q": "Describe an investigation comparing how high different balls bounce when dropped from the same height. Include variables, reliability and energy.", "model": "Independent variable: ball type. Dependent variable: rebound height. Control drop height, surface and release method. Repeat trials and average results. Calculate rebound height/drop height × 100%. Explain energy transfers to sound and thermal energy; avoid assuming ball size alone causes results.", "topic": "energy"}, {"type": "long", "q": "Explain useful and wasted energy in two devices and calculate efficiency for one device with 120 J input and 90 J useful output.", "model": "Examples: lamp useful light, wasted thermal energy; electric fan useful motion of air, wasted sound/thermal energy. Efficiency = 90/120 × 100 = 75%. Wasted energy is transferred, not destroyed.", "topic": "electricity"}]}</script><script>
'use strict';
const source=JSON.parse(document.getElementById('dataset').textContent),app=document.getElementById('app');
const DOC='https://docs.google.com/document/d/1OyIXDL7hTKDUfXjG5CZ77cJ3EWnzPTycf0DuttbotZU/edit';
const STORE='jadens-revision-lab-v2';let saved={};try{saved=JSON.parse(localStorage.getItem(STORE))||{}}catch(e){}
let state={page:'home',topic:'all',section:'dashboard',questions:[],answers:{},marks:{},index:0,submitted:false,attempt:0,cardOrder:[],cardIndex:0,flipped:false,ratings:saved.ratings||{},results:saved.results||[],filter:'all',seed:0};
function persist(){try{localStorage.setItem(STORE,JSON.stringify({ratings:state.ratings,results:state.results.slice(-50)}))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function go(page,section){state.page=page;if(section)state.section=section;render();window.scrollTo(0,0)}
function chooseTopic(t){state.topic=t;state.section='dashboard';state.questions=[];state.answers={};state.marks={};state.submitted=false;state.cardOrder=[];state.cardIndex=0;state.filter='all';go('science')}
function titleTopic(){return state.topic==='all'?'Energy & Electrical Circuits':state.topic==='energy'?'Energy & Energy Transformations':'Electricity & Circuits'}
function getCards(){return source.cards.map((c,i)=>({...c,id:i})).filter(c=>state.topic==='all'||c.topic===state.topic)}
function cardPercent(){let a=getCards(),known=a.filter(c=>state.ratings[c.id]==='known').length;return {known,total:a.length,pct:a.length?Math.round(known/a.length*100):0,reviewed:a.filter(c=>state.ratings[c.id]).length}}
function latestScore(){let r=state.results.filter(x=>x.topic===state.topic);return r.length?r.at(-1).score+'%':'Not taken'}
function home(){app.innerHTML=`<div class="hero"><div class="eyebrow">Welcome back</div><h1>What are we learning today?</h1><p class="muted">Choose a subject to open its topics, revision materials, flashcards and practice tests.</p></div><div class="cards-grid">${[['📐','Math','math'],['📖','English','english'],['🌍','Humanities','humanities'],['🔬','Science','science'],['💚','Health','health']].map(([e,n,id])=>`<button class="tile" ${id==='science'?'onclick="go(\'topics\')"':'disabled title="Coming soon"'}><span class="emoji">${e}</span><strong>${n}</strong><small>${id==='science'?'Explore topics →':'Coming soon · Add topics later'}</small></button>`).join('')}</div><div class="panel"><h3>Your revision workspace</h3><p class="muted">Science is ready with a reusable question generator, flashcards and a link to your revision sheet. The other subjects are placeholders for future content.</p></div>`}
function topics(){app.innerHTML=`<section class="hero"><button class="back" onclick="go('home')">← All subjects</button><div class="eyebrow">Science</div><h1>Choose a topic</h1><p class="muted">Study one topic at a time or combine everything into a full practice test.</p></section><div class="cards-grid">${[['⚡','Energy & Energy Transformations','energy','Energy forms, conservation, efficiency, kinetic and potential energy'],['🔌','Electricity & Circuits','electricity','Current, voltage, resistance, AC/DC, series and parallel circuits'],['🧪','All Science Topics','all','Combined revision across both topics']].map(([e,n,id,d])=>`<button class="tile" onclick="chooseTopic('${id}')"><span class="emoji">${e}</span><strong>${n}</strong><small>${d}</small></button>`).join('')}</div>`}
function science(){let cp=cardPercent();app.innerHTML=`<div class="hero"><button class="back" onclick="go('topics')">← Science topics</button><div class="eyebrow">Science / ${esc(titleTopic())}</div><h1>${esc(titleTopic())}</h1><p class="muted">Choose a learning tool below. Your progress stays on this device.</p></div><div class="subnav">${[['dashboard','Overview'],['quiz','Practice test'],['cards','Flashcards'],['guide','Study guide'],['sheet','Revision sheet']].map(([id,n])=>`<button class="${state.section===id?'active':''}" onclick="go('science','${id}')">${n}</button>`).join('')}</div><div id="workspace"></div>`;const el=document.getElementById('workspace');if(state.section==='dashboard')el.innerHTML=`<div class="metrics"><div class="metric"><strong>${latestScore()}</strong><small>Latest test score</small></div><div class="metric"><strong>${cp.pct}%</strong><small>Flashcards known (${cp.known}/${cp.total})</small></div><div class="metric"><strong>${state.results.filter(x=>x.topic===state.topic).length}</strong><small>Completed tests</small></div></div><div class="cards-grid">${[['📝','Practice test','quiz','Generate a new 35-question test or retry your last one'],['🗂️','Flashcards','cards','Flip, rate and track your glossary terms'],['📚','Study guide','guide','Key formulas, explanations and examples'],['📄','Revision sheet','sheet','Open your original Google Doc']].map(([e,n,id,d])=>`<button class="tile" onclick="go('science','${id}')"><span class="emoji">${e}</span><strong>${n}</strong><small>${d}</small></button>`).join('')}</div>`;else if(state.section==='quiz')quizView(el);else if(state.section==='cards')cardsView(el);else if(state.section==='guide')guideView(el);else sheetView(el)}
// Generate fresh numeric questions on every run, then select and shuffle from a larger question pool.
function generated(){let out=[];for(let k=0;k<40;k++){
 let m=1+Math.floor(Math.random()*8),v=2+Math.floor(Math.random()*11),h=1+Math.floor(Math.random()*12),r=2+Math.floor(Math.random()*12),I=1+Math.floor(Math.random()*8),drop=100+Math.floor(Math.random()*8)*10,percent=30+Math.floor(Math.random()*11)*5,rebound=drop*percent/100;
 let ke=m*v*v/2,gpe=+(m*9.8*h).toFixed(2),volts=r*I;
 const mc=(topic,q,correct,wrong,explanation)=>{let opts=shuffle([String(correct),...wrong.map(String)]);out.push({type:'mc',topic,q,options:opts,answer:opts.indexOf(String(correct)),explanation})};
 mc('energy',`A ${m} kg object moves at ${v} m/s. What is its kinetic energy?`,`${ke} J`,[`${m*v} J`,`${m*v*v} J`,`${ke+v} J`],`KE = ½mv² = ½ × ${m} × ${v}² = ${ke} J.`);
 mc('energy',`A ${m} kg object is lifted ${h} m. Using g = 9.8 N/kg, what is its gravitational potential energy?`,`${gpe} J`,[`${+(m*h).toFixed(2)} J`,`${+(m*9.8).toFixed(2)} J`,`${+(gpe+9.8).toFixed(2)} J`],`GPE = mgh = ${m} × 9.8 × ${h} = ${gpe} J.`);
 mc('electricity',`A resistor of ${r} Ω carries ${I} A. What is the potential difference across it?`,`${volts} V`,[`${r+I} V`,`${Math.abs(r-I)} V`,`${volts+r} V`],`V = IR = ${I} × ${r} = ${volts} V.`);
 mc('electricity',`A ${r} Ω resistor has ${volts} V across it. What is the current?`,`${I} A`,[`${volts} A`,`${r} A`,`${I+r} A`],`I = V/R = ${volts}/${r} = ${I} A.`);
 mc('energy',`A ball dropped from ${drop} cm rebounds to ${rebound} cm. What is its rebound-height efficiency?`,`${percent}%`,[`${100-percent}%`,`${percent/2}%`,`${Math.min(99,percent+10)}%`],`Rebound efficiency = ${rebound}/${drop} × 100 = ${percent}%.`);
 out.push({type:'short',topic:'energy',q:`Calculate the kinetic energy of a ${m} kg object moving at ${v} m/s. Show your working.`,model:`KE = ½ × ${m} × ${v}² = ${ke} J.`,rubric:['Use KE = ½mv²','Substitute values correctly','State '+ke+' J']});
 out.push({type:'short',topic:'electricity',q:`A ${r} Ω resistor has ${volts} V across it. Calculate the current and include the unit.`,model:`I = V/R = ${volts}/${r} = ${I} A.`,rubric:['Use I = V/R','Substitute values correctly','State '+I+' A']});
 out.push({type:'short',topic:'energy',q:`A ball falls from ${drop} cm and rebounds to ${rebound} cm. Calculate the rebound-height efficiency.`,model:`${rebound}/${drop} × 100 = ${percent}%.`,rubric:['Use rebound height ÷ drop height × 100','Substitute both heights','State '+percent+'%']});
 out.push({type:'long',topic:'energy',q:`A ${m} kg object starts ${h} m above the ground. Calculate its starting gravitational potential energy (g = 9.8 N/kg), then explain the energy transfers as it falls and bounces.`,model:`GPE = ${m} × 9.8 × ${h} = ${gpe} J. As it falls, gravitational potential energy transfers into kinetic energy. At impact, energy is briefly stored elastically, while some transfers into thermal energy and sound. On rebound, the remaining mechanical energy transfers back into kinetic and gravitational potential energy. Total energy is conserved.`,rubric:['Correct GPE formula and substitution','Correct result with joules','Describe falling transformation','Describe impact and rebound','Explain sound/thermal transfers and conservation']});
 out.push({type:'long',topic:'electricity',q:`A ${r} Ω resistor is connected across ${volts} V. Calculate its current, explain resistance, and compare what happens when another resistor is added in series versus in parallel.`,model:`I = ${volts}/${r} = ${I} A. Resistance opposes current. Adding resistance in series increases total resistance and reduces supply current (for a fixed voltage). Adding a branch in parallel reduces equivalent resistance and increases total supply current; each branch has the supply voltage.`,rubric:['Correct current calculation','Correct amperes unit','Define resistance','Explain series effect','Explain parallel effect']});
 }
 return out}
let pool=[];function newTest(){pool=[...source.questions.map(q=>({...q,rubric:q.type==='mc'?[]:rubricFor(q)})),...generated()];let counts={mc:20,short:10,long:5};let topics=state.topic==='all'?['energy','electricity']:[state.topic];let chosen=[];for(let type of Object.keys(counts)){let candidates=shuffle(pool.filter(q=>q.type===type&&topics.includes(q.topic)));if(state.topic==='all'){let e=candidates.filter(q=>q.topic==='energy'),c=candidates.filter(q=>q.topic==='electricity');let n=Math.floor(counts[type]/2);chosen.push(...e.slice(0,n),...c.slice(0,counts[type]-n))}else chosen.push(...candidates.slice(0,counts[type]))}state.questions=[...shuffle(chosen.filter(q=>q.type==='mc')),...shuffle(chosen.filter(q=>q.type==='short')),...shuffle(chosen.filter(q=>q.type==='long'))];state.answers={};state.marks={};state.index=0;state.submitted=false;state.attempt++;render()}
function rubricFor(q){if(q.type==='short')return ['Relevant scientific concept','Correct explanation or calculation','Appropriate units or example'];return ['Accurate scientific concepts','Relevant terminology','Clear explanation of relationships','Correct examples or working','Complete answer addressing the question']}
function retry(){state.answers={};state.marks={};state.index=0;state.submitted=false;render()}
function answered(){return state.questions.filter((q,i)=>String(state.answers[i]??'').trim()).length}
function quizView(el){if(!state.questions.length){el.innerHTML=`<div class="panel"><h2>Practice test generator</h2><p>Each test has <b>20 multiple-choice, 10 short-answer and 5 long-answer questions</b>. New tests vary the selection, order and numerical values, so you can generate fresh practice repeatedly.</p><p class="note">Multiple choice is automatically marked. You score written answers yourself against the model answer and marking criteria, giving a full-test percentage.</p><button class="btn" onclick="newTest()">Generate my first test →</button></div>`;return}if(state.submitted){resultView(el);return}let q=state.questions[state.index],i=state.index;el.innerHTML=`<div class="panel"><div class="row"><div><div class="eyebrow">${q.type==='mc'?'Multiple choice':q.type==='short'?'Short answer':'Long answer'}</div><h2>Question ${i+1} of ${state.questions.length}</h2></div><span class="pill">${answered()} answered</span></div><div class="progress"><div style="width:${answered()/state.questions.length*100}%"></div></div><div class="question">${esc(q.q)}</div><div id="answerArea"></div><div id="model" class="feedback hidden"></div><div class="buttons" style="margin-top:22px"><button class="btn secondary" onclick="moveQ(-1)" ${i===0?'disabled':''}>← Previous</button><button class="btn secondary" onclick="toggleModel()">${q.type==='mc'?'Answer guide':'Model answer & criteria'}</button><button class="btn" onclick="moveQ(1)">${i===state.questions.length-1?'Finish & mark test →':'Next →'}</button></div><p class="note">Your current answers stay available while navigating. Written responses are self-marked at the end.</p></div>`;let area=document.getElementById('answerArea');if(q.type==='mc')area.innerHTML=q.options.map((x,j)=>`<label class="option"><input type="radio" name="mc" value="${j}" ${state.answers[i]===String(j)?'checked':''} onchange="saveAnswer(this.value)"><span>${'ABCD'[j]}. ${esc(x)}</span></label>`).join('');else area.innerHTML=`<textarea aria-label="Your answer" placeholder="Write your explanation here…" oninput="saveAnswer(this.value)">${esc(state.answers[i]||'')}</textarea>`}
function saveAnswer(v){state.answers[state.index]=v;let p=document.querySelector('.pill');if(p)p.textContent=answered()+' answered';let bar=document.querySelector('.progress>div');if(bar)bar.style.width=(answered()/state.questions.length*100)+'%'}
function moveQ(n){if(n===1&&state.index===state.questions.length-1){state.submitted=true;render();return}state.index=Math.max(0,Math.min(state.questions.length-1,state.index+n));render()}
function toggleModel(){let q=state.questions[state.index],box=document.getElementById('model');box.textContent=q.type==='mc'?`Correct answer: ${'ABCD'[q.answer]}. ${q.options[q.answer]}\n${q.explanation||''}`:`Model answer:\n${q.model}\n\nMarking criteria:\n• ${(q.rubric||rubricFor(q)).join('\n• ')}`;box.classList.toggle('hidden')}
function resultView(el){let mc=state.questions.slice(0,20),correct=mc.filter((q,i)=>state.answers[i]===String(q.answer)).length;let written=state.questions.slice(20),max=20+written.reduce((a,q)=>a+(q.rubric||rubricFor(q)).length,0);let points=correct+written.reduce((a,q,j)=>a+(Number(state.marks[j])||0),0);let complete=written.every((q,j)=>state.marks[j]!==undefined);let pct=Math.round(points/max*100);el.innerHTML=`<div class="panel"><div class="eyebrow">Test completed · Marking</div><h2>Your results</h2><div class="metrics"><div class="metric"><strong>${correct}/20</strong><small>Multiple-choice correct</small></div><div class="metric"><strong>${complete?pct+'%':'Pending'}</strong><small>Overall test score</small></div><div class="metric"><strong>${answered()}/35</strong><small>Questions answered</small></div></div><p class="note">Review each written answer and choose a score based on the marking criteria. Your overall percentage updates once every written response has been marked.</p><div id="writtenReview"></div><div class="buttons"><button class="btn" onclick="saveTestResult()" ${!complete?'disabled':''}>Save ${pct}% result</button><button class="btn secondary" onclick="retry()">Retry same questions</button><button class="btn secondary" onclick="newTest()">Generate different test ↻</button></div></div>`;let target=document.getElementById('writtenReview');target.innerHTML=written.map((q,j)=>{let criteria=q.rubric||rubricFor(q);return `<details class="feedback"><summary><b>Question ${j+21}:</b> ${esc(q.q)}</summary><p><b>Your answer</b></p><p>${esc(state.answers[j+20]||'(No answer)')}</p><p><b>Model answer</b></p><p>${esc(q.model)}</p><p><b>Marking criteria (${criteria.length} marks)</b></p><ul>${criteria.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="markrow"><label for="mark${j}">Awarded marks:</label><select id="mark${j}" onchange="markWritten(${j},this.value)"><option value="">Choose mark</option>${Array.from({length:criteria.length+1},(_,i)=>`<option value="${i}" ${state.marks[j]===i?'selected':''}>${i} / ${criteria.length}</option>`).join('')}</select></div></details>`}).join('')}
function markWritten(j,value){if(value==='')delete state.marks[j];else state.marks[j]=Number(value);render()}
function saveTestResult(){let w=state.questions.slice(20);if(!w.every((q,j)=>state.marks[j]!==undefined))return;let mc=state.questions.slice(0,20).filter((q,i)=>state.answers[i]===String(q.answer)).length,max=20+w.reduce((n,q)=>n+(q.rubric||rubricFor(q)).length,0),pts=mc+w.reduce((n,q,j)=>n+state.marks[j],0),score=Math.round(pts/max*100);state.results.push({topic:state.topic,score,date:new Date().toLocaleDateString('en-AU')});persist();alert(`Saved! Your overall test score is ${score}% (${pts}/${max} marks).`);go('science','dashboard')}
function cardsView(el){let cp=cardPercent();if(!state.cardOrder.length||state.cardOrder.some(i=>!getCards().some(c=>c.id===i))){state.cardOrder=shuffle(getCards().map(c=>c.id));state.cardIndex=0;state.flipped=false}let list=state.cardOrder.filter(i=>state.filter==='all'||(state.filter==='known'?state.ratings[i]==='known':state.ratings[i]!=='known'));let id=list[Math.min(state.cardIndex,list.length-1)],c=source.cards[id];el.innerHTML=`<div class="panel"><div class="row"><div><div class="eyebrow">Glossary flashcards</div><h2>${cp.total} cards to learn</h2></div><select id="filter" onchange="setFilter(this.value)" style="background:#243650;color:white;padding:10px;border:1px solid #50637a;border-radius:10px"><option value="all" ${state.filter==='all'?'selected':''}>All cards</option><option value="learning" ${state.filter==='learning'?'selected':''}>Still learning</option><option value="known" ${state.filter==='known'?'selected':''}>Known cards</option></select></div><div class="metrics"><div class="metric"><strong>${cp.pct}%</strong><small>Flashcard mastery</small></div><div class="metric"><strong>${cp.known}/${cp.total}</strong><small>Marked known</small></div><div class="metric"><strong>${cp.reviewed}/${cp.total}</strong><small>Reviewed</small></div></div><div class="progress"><div style="width:${cp.pct}%"></div></div>${c?`<p class="muted">Card ${Math.min(state.cardIndex+1,list.length)} of ${list.length}</p><button class="flash" onclick="flipCard()"><small>${state.flipped?'DEFINITION':'TERM'}</small><strong>${esc(state.flipped?c.back:c.front)}</strong><small>Tap to flip</small></button><div class="buttons" style="margin-top:18px"><button class="btn secondary" onclick="stepCard(-1)">← Previous</button><button class="btn secondary" onclick="flipCard()">Flip</button><button class="btn secondary" onclick="stepCard(1)">Next →</button><button class="btn secondary" onclick="shuffleCards()">Shuffle</button></div><div class="buttons" style="margin-top:12px"><button class="btn danger" onclick="rateCard('learning')">× Still learning</button><button class="btn" onclick="rateCard('known')">✓ I know it</button></div>`:'<div class="summary">No flashcards match this filter. Change the filter to continue.</div>'}<p class="note">Flashcard percentage = terms marked “I know it” ÷ total terms in this topic × 100. This is a self-reported mastery score, not an exam grade.</p></div>`}
function setFilter(v){state.filter=v;state.cardIndex=0;state.flipped=false;render()}
function flipCard(){state.flipped=!state.flipped;render()}
function stepCard(n){let a=state.cardOrder.filter(i=>state.filter==='all'||(state.filter==='known'?state.ratings[i]==='known':state.ratings[i]!=='known'));if(!a.length)return;state.cardIndex=(state.cardIndex+n+a.length)%a.length;state.flipped=false;render()}
function shuffleCards(){state.cardOrder=shuffle(state.cardOrder);state.cardIndex=0;state.flipped=false;render()}
function rateCard(v){let a=state.cardOrder.filter(i=>state.filter==='all'||(state.filter==='known'?state.ratings[i]==='known':state.ratings[i]!=='known'));if(!a.length)return;state.ratings[a[Math.min(state.cardIndex,a.length-1)]]=v;persist();state.flipped=false;let b=state.cardOrder.filter(i=>state.filter==='all'||(state.filter==='known'?state.ratings[i]==='known':state.ratings[i]!=='known'));state.cardIndex=b.length?Math.min(state.cardIndex,b.length-1):0;render()}
function guideView(el){const energy=`<article><h3>Energy forms</h3><ul><li><b>Energy:</b> capacity to do work or cause change, measured in joules (J).</li><li><b>Kinetic energy:</b> energy of motion.</li><li><b>Potential energy:</b> stored energy (gravitational, elastic, chemical).</li><li><b>Conservation:</b> energy cannot be created or destroyed, only transferred or transformed.</li></ul></article><article><h3>Formulas and efficiency</h3><ul><li><b>KE = ½mv²</b> (m in kg, v in m/s).</li><li><b>GPE = mgh</b> (g ≈ 9.8 N/kg).</li><li><b>Efficiency (%) = useful output ÷ total input × 100.</b></li><li><b>Rebound efficiency:</b> rebound height ÷ drop height × 100.</li><li>When a ball bounces, some energy transfers into sound and thermal energy.</li></ul></article>`;const electricity=`<article><h3>Electricity fundamentals</h3><ul><li><b>Current:</b> charge flow per second (A).</li><li><b>Voltage:</b> energy transferred per charge (V).</li><li><b>Resistance:</b> opposition to current (Ω).</li><li><b>Ohm's law:</b> V = IR.</li><li><b>Conductor:</b> allows charge to flow easily; <b>insulator:</b> resists charge flow.</li><li><b>Voltmeter:</b> parallel. <b>Ammeter:</b> series.</li></ul></article><article><h3>Circuit comparisons</h3><ul><li><b>Series:</b> one path; same current; voltage shared. A break stops the whole circuit.</li><li><b>Parallel:</b> multiple branches; same voltage across branches; current splits. One branch can fail without stopping the others.</li><li><b>DC:</b> charge flows in one direction.</li><li><b>AC:</b> reverses direction periodically; Australian mains electricity is 50 Hz.</li></ul></article>`;el.innerHTML=`<div class="panel"><h2>Study guide overview</h2><p class="muted">Key notes from your Science Revision Sheet.</p><div class="guide">${state.topic==='all'?energy+electricity:state.topic==='energy'?energy:electricity}</div><p class="note">For full elaborations, diagrams and the original notes, open the Revision sheet tab.</p></div>`}
function sheetView(el){el.innerHTML=`<div class="panel"><h2>Your science revision sheet</h2><p>Access your Google Doc with the complete notes, elaborations, diagrams, comparison table and glossary.</p><p><a href="${DOC}" target="_blank" rel="noopener noreferrer" class="btn" style="display:inline-block;text-decoration:none">Open revision sheet ↗</a></p><p class="note">The revision sheet opens online in Google Docs. The rest of this website works offline.</p></div>`}
function render(){if(state.page==='home')home();else if(state.page==='topics')topics();else science()}
render();
</script>
